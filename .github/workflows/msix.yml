name: MSIX

# Builds the Microsoft Store package and checks that it installs and starts.
# Runs on demand and on branches named msix-*; releases build it too.
on:
  workflow_dispatch:
  push:
    branches: ["msix-*"]

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build app
        shell: powershell
        run: ./scripts/build.ps1 -SkipInstaller
      - name: Build MSIX
        shell: powershell
        run: |
          $identity = Get-Content installer/msix/store-identity.json -Raw | ConvertFrom-Json
          if ($identity.identity_name -eq '__SET_ME__') { ./scripts/build-msix.ps1 -AllowPlaceholderIdentity }
          else { ./scripts/build-msix.ps1 }
      - name: Install and launch (throwaway test certificate)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msix = Get-ChildItem dist/*.msix | Select-Object -First 1
          # The real package is signed by the Store; here a self-signed cert lets Windows install it.
          [xml]$manifest = Get-Content build/msix/AppxManifest.xml
          $publisher = $manifest.Package.Identity.Publisher
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pwd = ConvertTo-SecureString -String 'test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath build/test.pfx -Password $pwd | Out-Null
          Import-PfxCertificate -FilePath build/test.pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pwd | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\x64\' } | Sort-Object FullName -Descending | Select-Object -First 1
          Copy-Item $msix.FullName build/test-signed.msix
          & $signtool.FullName sign /fd SHA256 /f build/test.pfx /p test build/test-signed.msix
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Add-AppxPackage -Path build/test-signed.msix
          $pkg = Get-AppxPackage -Name $manifest.Package.Identity.Name
          Write-Host "Installed $($pkg.PackageFullName)"
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!Invisipal"
          Start-Sleep -Seconds 12
          $proc = Get-Process -Name Invisipal -ErrorAction SilentlyContinue
          if (-not $proc) { throw 'Invisipal did not start from the MSIX package' }
          Write-Host "Running: pid $($proc.Id)"
          $docs = [Environment]::GetFolderPath('MyDocuments')
          Get-ChildItem (Join-Path $docs 'Invisipal') -Recurse | Select-Object -ExpandProperty FullName
          if (-not (Test-Path (Join-Path $docs 'Invisipal\guides\guia.txt'))) { throw 'Example guides were not seeded' }
          Stop-Process -Name Invisipal -Force
          Remove-AppxPackage -Package $pkg.PackageFullName
      - name: Windows App Certification Kit
        continue-on-error: true
        shell: powershell
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) { Write-Warning 'WACK not installed on this runner'; exit 0 }
          $msix = (Get-ChildItem build/test-signed.msix).FullName
          & $appcert reset
          & $appcert test -appxpackagepath $msix -reportoutputpath "$PWD\build\wack-report.xml"
          [xml]$report = Get-Content build/wack-report.xml
          Write-Host "WACK overall result: $($report.REPORT.OVERALL_RESULT)"
          $report.SelectNodes('//TEST') | Where-Object { $_.RESULT.'#cdata-section' -ne 'PASS' } |
            ForEach-Object { Write-Host "$($_.RESULT.'#cdata-section'): $($_.NAME)" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invisipal-msix
          path: |
            dist/*.msix
            build/wack-report.xml
