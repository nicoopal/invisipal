name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip pytest pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Package Claude skill
        run: python -c "import shutil; shutil.rmtree('skills/invisipal-cards/scripts/__pycache__', ignore_errors=True); shutil.make_archive('dist/invisipal-cards', 'zip', 'skills', 'invisipal-cards'); shutil.move('dist/invisipal-cards.zip', 'dist/invisipal-cards.skill')"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Invisipal-*-win64.zip
            dist/invisipal-cards.skill
          generate_release_notes: true
