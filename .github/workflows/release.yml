name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install --upgrade pip pytest pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Install Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: powershell
        run: ./scripts/build.ps1
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Invisipal-Setup.exe
            dist/Invisipal-portable.exe
            dist/invisipal-cards.skill
          fail_on_unmatched_files: true
          generate_release_notes: true
