[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "invisipal"
dynamic = ["version"]
description = "An on-screen meeting guide that stays out of your screen share (Windows 10/11, zero dependencies)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nico Palermo" }]
keywords = [
    "meeting", "notes", "teleprompter", "overlay", "screen-share",
    "screen-capture", "privacy", "tkinter", "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller"]

[project.gui-scripts]
invisipal = "invisipal.__main__:main"

[project.urls]
Homepage = "https://github.com/nicoopal/invisipal"
Repository = "https://github.com/nicoopal/invisipal"
Issues = "https://github.com/nicoopal/invisipal/issues"
Changelog = "https://github.com/nicoopal/invisipal/releases"

[tool.setuptools]
packages = ["invisipal"]

[tool.setuptools.package-data]
invisipal = ["assets/*", "examples/*"]

[tool.setuptools.dynamic]
version = { attr = "invisipal.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip() without strict= is fine here
